<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07170f"><title>Julefrokost 2026 — Login</title>
<style>
:root{--green:#07170f;--green2:#0c281a;--cream:#fff9ec;--gold:#e5bd62;--red:#c93636;--muted:#aebbb2}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#194a2e 0,var(--green) 46%,#030a07 100%);color:var(--cream);overflow-x:hidden}.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.flake{position:absolute;top:-12vh;color:#fff;opacity:.7;animation:fall linear infinite;text-shadow:0 0 8px #fff}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(360deg)}}.wrap{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.panel{width:min(100%,420px);text-align:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}.ornament{font-size:30px;filter:drop-shadow(0 5px 8px #0007)}h1{font-family:Georgia,serif;font-size:clamp(42px,13vw,62px);line-height:.88;letter-spacing:-.04em;margin:8px 0 12px}.year{color:var(--gold);font-style:italic} .intro{color:#d9e0da;font-size:15px;line-height:1.5;margin:0 auto 25px;max-width:330px}.card{background:linear-gradient(145deg,#ffffff12,#ffffff08);border:1px solid #ffffff20;border-radius:24px;padding:23px;box-shadow:0 22px 70px #0008,inset 0 1px #ffffff18;backdrop-filter:blur(10px);text-align:left}.label{display:block;margin:0 0 8px 3px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#dce5de}.field{position:relative;margin-bottom:17px}.field span{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px}input{width:100%;border:1px solid #ffffff24;background:#04110bb8;color:white;border-radius:14px;padding:15px 15px 15px 46px;font:inherit;font-size:16px;outline:none;transition:.2s}input::placeholder{color:#74857a}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e5bd621d}.pin{letter-spacing:.28em;font-weight:800}button{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(135deg,#d8ad4d,#f0ce79);color:#132015;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 10px 30px #0007;cursor:pointer;transition:.15s}button:active{transform:scale(.985)}.hint{text-align:center;color:var(--muted);font-size:11px;margin:15px 0 0}.error{display:none;color:#ffb4b4;font-size:12px;text-align:center;margin:12px 0 0}.footer{margin-top:22px;color:#718178;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.holly{color:var(--red)}@media(max-height:680px){.wrap{align-items:flex-start}.ornament{font-size:24px}h1{font-size:43px}.intro{margin-bottom:15px}.card{padding:18px}}
</style></head><body><div class="snow" id="snow"></div><main class="wrap"><section class="panel"><div class="ornament">🎄</div><div class="eyebrow">Du er inviteret</div><h1>Julefrokost<br><span class="year">2026</span></h1><p class="intro">Indtast dit navn og din personlige kode.<br>Så åbner dørene til årets julefrokost.</p><form class="card" id="login"><label class="label" for="name">Navn</label><div class="field"><span>👤</span><input id="name" autocomplete="name" placeholder="Dit navn" required></div><label class="label" for="pin">Personlig PIN</label><div class="field"><span>🔐</span><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code" placeholder="••••" required></div><button type="submit">Luk mig ind →</button><p class="error" id="error">Login bliver aktiveret, når gæstelisten er klar.</p><p class="hint">Din PIN er personlig. Hold den for dig selv.</p></form><div class="footer"><span class="holly">●</span> København · December 2026 <span class="holly">●</span></div></section></main>
<script>
const snow=document.getElementById('snow');for(let i=0;i<38;i++){const f=document.createElement('i');f.className='flake';f.textContent=Math.random()>.7?'❄':'•';f.style.left=Math.random()*100+'vw';f.style.fontSize=(7+Math.random()*12)+'px';f.style.animationDuration=(7+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*15)+'s';f.style.setProperty('--drift',(Math.random()*80-40)+'px');snow.appendChild(f)}
document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();document.getElementById('error').style.display='block'})
</script></body></html>
