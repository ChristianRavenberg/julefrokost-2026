<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07170f"><title>Julefrokost 2026</title><style>
:root{--g:#07170f;--cream:#fff9ec;--gold:#e5bd62;--red:#c93636;--muted:#aebbb2}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -10%,#194a2e 0,var(--g) 46%,#030a07 100%);color:var(--cream);overflow-x:hidden}.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}.flake{position:absolute;top:-12vh;color:#fff;opacity:.7;animation:fall linear infinite}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(360deg)}}.wrap{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.panel{width:min(100%,420px);text-align:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}.ornament{font-size:30px}h1{font-family:Georgia,serif;font-size:clamp(42px,13vw,62px);line-height:.88;letter-spacing:-.04em;margin:8px 0 12px}.year{color:var(--gold);font-style:italic}.intro{color:#d9e0da;font-size:15px;line-height:1.5;margin:0 auto 25px;max-width:340px}.card{background:linear-gradient(145deg,#ffffff12,#ffffff08);border:1px solid #ffffff20;border-radius:24px;padding:23px;box-shadow:0 22px 70px #0008;backdrop-filter:blur(10px);text-align:left}.label{display:block;margin:0 0 8px 3px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.field{position:relative;margin-bottom:17px}.field span{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:18px}input{width:100%;border:1px solid #ffffff24;background:#04110bb8;color:white;border-radius:14px;padding:15px 15px 15px 46px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e5bd621d}.pin{letter-spacing:.28em;font-weight:800}button{width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(135deg,#d8ad4d,#f0ce79);color:#132015;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.65}.hint,.msg{text-align:center;font-size:11px;margin:14px 0 0}.hint{color:var(--muted)}.msg{display:none;color:#ffb4b4}.footer{margin-top:22px;color:#718178;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.holly{color:var(--red)}.welcome{display:none}.welcome .card{text-align:center}.welcome h2{font-family:Georgia,serif;font-size:34px;margin:6px 0 10px}.badge{display:inline-block;padding:6px 10px;border:1px solid #e5bd6255;border-radius:999px;color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
</style></head><body><div class="snow" id="snow"></div><main class="wrap"><section class="panel" id="loginView"><div class="ornament">🎄</div><div class="eyebrow">Du er inviteret</div><h1>Julefrokost<br><span class="year">2026</span></h1><p class="intro">Indtast dit navn og din personlige kode.<br>Så åbner dørene til årets julefrokost.</p><form class="card" id="login"><label class="label">Navn</label><div class="field"><span>👤</span><input id="name" placeholder="Dit navn" autocomplete="name" required></div><label class="label">Personlig PIN</label><div class="field"><span>🔐</span><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required></div><button id="btn">Luk mig ind →</button><p class="msg" id="msg"></p><p class="hint">Din PIN er personlig. Hold den for dig selv.</p></form><div class="footer"><span class="holly">●</span> København · December 2026 <span class="holly">●</span></div></section><section class="panel welcome" id="welcome"><div class="ornament">🥂</div><div class="eyebrow">Adgang godkendt</div><div class="card"><span class="badge" id="role"></span><h2 id="hello"></h2><p class="intro">Du er inde. Mere bliver afsløret, når vi nærmer os julefrokosten.</p></div></section></main><script>
const URL='https://gfetosmadyzmihhwrrcm.supabase.co',KEY='sb_publishable_K3s2Dj3m_XnUduIc5YIE-w_PzseXaxU';const snow=document.getElementById('snow');for(let i=0;i<38;i++){const f=document.createElement('i');f.className='flake';f.textContent=Math.random()>.7?'❄':'•';f.style.left=Math.random()*100+'vw';f.style.fontSize=(7+Math.random()*12)+'px';f.style.animationDuration=(7+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*15)+'s';f.style.setProperty('--drift',(Math.random()*80-40)+'px');snow.appendChild(f)}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('btn'),msg=document.getElementById('msg');btn.disabled=true;btn.textContent='Tjekker listen…';msg.style.display='none';try{const res=await fetch(URL+'/rest/v1/rpc/guest_login',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({input_name:document.getElementById('name').value,input_pin:document.getElementById('pin').value})});if(!res.ok)throw new Error();const data=await res.json();if(!data.length){msg.textContent='Navn eller PIN er forkert.';msg.style.display='block';return}const u=data[0];sessionStorage.setItem('guest',JSON.stringify(u));show(u)}catch(_){msg.textContent='Der opstod en forbindelsesfejl. Prøv igen.';msg.style.display='block'}finally{btn.disabled=false;btn.textContent='Luk mig ind →'}});
function show(u){document.getElementById('loginView').style.display='none';document.getElementById('welcome').style.display='block';document.getElementById('hello').textContent='Velkommen, '+u.name+'!';document.getElementById('role').textContent=u.role==='admin'?'🎅 Admin':'🎁 Gæst'}const saved=sessionStorage.getItem('guest');if(saved)try{show(JSON.parse(saved))}catch(_){}
</script></body></html>
